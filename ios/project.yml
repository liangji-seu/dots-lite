name: DotsLite
options:
  deploymentTarget:
    iOS: "16.0"
  bundleIdPrefix: com.liangji
packages:
  DotsCore:
    path: DotsCore
targets:
  DotsLite:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DotsLite
    dependencies:
      - package: DotsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liangji.dotslite
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: DotsLite/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
